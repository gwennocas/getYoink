[package]
name = "tauri-plugin-downloader"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-downloader"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
